<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - WhatsApp Sales Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #060a13;
      --bg-card: rgba(15, 23, 42, 0.65);
      --bg-input: rgba(15, 23, 42, 0.7);
      --border-card: rgba(148, 163, 184, 0.08);
      --border-input: rgba(100, 116, 139, 0.3);
      --border-focus: #10b981;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-from: #10b981;
      --accent-to: #14b8a6;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --danger-bg: rgba(244, 63, 94, 0.08);
      --danger-border: rgba(244, 63, 94, 0.2);
      --danger-text: #fb7185;
      --success-bg: rgba(16, 185, 129, 0.08);
      --success-border: rgba(16, 185, 129, 0.2);
      --success-text: #34d399;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(99, 102, 241, 0.12), transparent),
        radial-gradient(ellipse 70% 50% at 20% 80%, rgba(16, 185, 129, 0.08), transparent),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(139, 92, 246, 0.05), transparent);
      z-index: 0;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .logo-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      color: #0f172a;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 8px 32px var(--accent-glow), 0 0 0 1px rgba(16, 185, 129, 0.1);
      margin-bottom: 16px;
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 32px var(--accent-glow), 0 0 0 1px rgba(16, 185, 129, 0.1); }
      50% { box-shadow: 0 8px 48px rgba(16, 185, 129, 0.25), 0 0 0 1px rgba(16, 185, 129, 0.2); }
    }

    .logo-title {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg, #34d399, #2dd4bf, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.025em;
    }

    .logo-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 2rem;
      box-shadow:
        0 24px 48px -12px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .alert-box {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      border: 1px solid;
    }

    .alert-box.error { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
    .alert-box.success { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .alert-box.visible { display: block; }

    .form-group { margin-bottom: 1.25rem; }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder { color: var(--text-muted); }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      color: #0f172a;
      font-size: 0.9375rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .btn-submit:hover {
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .footer-text {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="logo-header">
      <div class="logo-icon">💬</div>
      <h1 class="logo-title">Akbar Store Admin</h1>
      <p class="logo-subtitle">Masuk untuk mengelola produk, order, dan broadcast</p>
    </div>

    <div class="glass-card">
      <div id="alertBox" class="alert-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" required class="form-input" placeholder="Masukkan username admin">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" required class="form-input" placeholder="••••••••">
        </div>
        <button type="submit" id="btnSubmit" class="btn-submit">Masuk Sekarang</button>
      </form>
    </div>

    <div class="footer-text">&copy; 2026 Akbar Store. All rights reserved.</div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/index.html';
    }

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert-box ${type} visible`;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Mencoba Masuk...';
      alertBox.className = 'alert-box';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Login berhasil! Mengalihkan...', 'success');
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          localStorage.setItem('role', data.role);
          setTimeout(() => { window.location.href = '/index.html'; }, 1000);
        } else {
          showAlert(data.message || 'Username atau password salah.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Masuk Sekarang';
        }
      } catch (err) {
        showAlert('Terjadi kesalahan koneksi ke server.');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Masuk Sekarang';
        console.error(err);
      }
    });
  </script>
</body>
</html>
